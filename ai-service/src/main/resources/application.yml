server:
  port: 8084

spring:
  application:
    name: ai-service
  
  datasource:
    url: jdbc:h2:mem:lms_ai_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ai:
  openai:
    api-key: ${OPENAI_API_KEY:your-openai-api-key}
    model: gpt-3.5-turbo
    base-url: https://api.openai.com/v1
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:your-anthropic-api-key}
    model: claude-3-sonnet-20240229
    base-url: https://api.anthropic.com
  code-analysis:
    enabled: true
    max-file-size: 1MB
  recommendations:
    enabled: true
    cache-ttl: 3600

logging:
  level:
    in.maven.ark.lms: DEBUG
