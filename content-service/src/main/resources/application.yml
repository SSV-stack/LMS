server:
  port: 8087

spring:
  application:
    name: content-service
  
  datasource:
    url: jdbc:h2:mem:lms_content_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

content:
  storage:
    type: local  # local, s3, azure
    base-path: ${CONTENT_STORAGE_PATH:./content-storage}
    cdn-base-url: ${CONTENT_CDN_URL:http://localhost:8087/content}
  video:
    enabled: true
    supported-formats: mp4,avi,mov,wmv,flv,webm
    max-size: 500MB
    transcode-enabled: false  # Would integrate with FFmpeg in production
  document:
    enabled: true
    supported-formats: pdf,epub,doc,docx,ppt,pptx,txt
    max-size: 50MB
    preview-enabled: true
  image:
    enabled: true
    supported-formats: jpg,jpeg,png,gif,svg,webp
    max-size: 10MB
    thumbnail-enabled: true

logging:
  level:
    in.maven.ark.lms: DEBUG
