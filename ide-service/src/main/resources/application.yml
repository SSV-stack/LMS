server:
  port: 8085

spring:
  application:
    name: ide-service
  
  datasource:
    url: jdbc:h2:mem:lms_ide_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

gold-ide:
  base-url: ${GOLD_IDE_BASE_URL:https://gold-ide.example.com}
  api-key: ${GOLD_IDE_API_KEY:your-api-key}
  session-timeout-minutes: 120

logging:
  level:
    in.maven.ark.lms: DEBUG
