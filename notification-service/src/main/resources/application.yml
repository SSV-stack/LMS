server:
  port: 8086

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:h2:mem:lms_notification_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
  
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

notification:
  email:
    enabled: true
    from-address: ${NOTIFICATION_FROM:noreply@lms.example.com}
    base-url: ${LMS_BASE_URL:http://localhost:3000}
  websocket:
    enabled: true
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
  push:
    enabled: false  # Would integrate with FCM/APNS in production
  queue:
    enabled: true
    max-retries: 3
    retry-delay: 5000

logging:
  level:
    in.maven.ark.lms: DEBUG
